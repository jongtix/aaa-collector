[versions]
spring-boot = "3.5.16"
dependency-management = "1.1.7"
spotless = "8.10.4"
spotbugs = "6.5.13"
pmd = "7.28.0"
google-java-format = "1.35.0"
archunit = "1.5.1"
wiremock = "3.10.6"
findsecbugs = "1.14.0"
bucket4j = "8.10.1"
jacoco = "0.8.13"
# micrometer-registry-prometheus는 Spring Boot BOM(spring-boot 3.5.15 → micrometer 1.15.12)이 관리하나,
# 의존성 버전 단일 소스 원칙(CLAUDE.md)에 따라 BOM 관리 버전과 동일하게 명시 핀 고정한다.
micrometer = "1.17.1"
# tomcat-embed-core/netty는 Spring Boot BOM(3.5.16, 3.5.x 최신)이 관리하는 기본값에 CRITICAL CVE가 있어
# (CVE-2026-65182/65905/68525, CVE-2026-75595, 2026-09-10) 상위로 덮어쓴다 — micrometer와 동일한 이유로
# 의존성 버전 단일 소스 원칙(CLAUDE.md)에 따라 여기 명시한다. 만료 게이트:
# DependencyVersionOverrideExpiryTest(2026-12-09까지 미해소 시 ./gradlew test 실패, Boot가 흡수하면
# 이 두 줄 + build.gradle.kts 덮어쓰기 블록 + 해당 테스트를 함께 삭제).
tomcat = "10.1.59"
netty = "4.1.138.Final"
# Jackson Bom(jackson-core CVE-2026-89407·CVE-2026-89425 / jackson-databind CVE-2026-68497·CVE-2026-91776·
# CVE-2026-91777 대응, 2026-10-13) — Spring Boot 3.5.16 BOM이 관리하는 2.21.4는 HIGH CVE 5건에 취약하다
# (Trivy 게이트 v1.81.2 실패 실측). build.gradle.kts에서 jackson-bom.version 오버라이드로 소비한다
# (aaa-notifier에서 실측 확정: jackson-2-bom.version은 무효, jackson-bom.version 단독으로 유효).
# 만료 게이트: DependencyVersionOverrideExpiryTest(2026-12-30) — Boot가 흡수하면 이 항목+오버라이드+
# 테스트 메서드를 함께 제거한다.
jackson2Bom = "2.21.7"

[libraries]
# Spring Boot (버전은 spring-dependency-management가 관리)
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
micrometer-registry-prometheus = { group = "io.micrometer", name = "micrometer-registry-prometheus", version.ref = "micrometer" }
spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
spring-boot-starter-data-redis = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis" }
spring-boot-starter-websocket = { group = "org.springframework.boot", name = "spring-boot-starter-websocket" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }

# Database
mysql-connector = { group = "com.mysql", name = "mysql-connector-j" }
flyway-core = { group = "org.flywaydb", name = "flyway-core" }
flyway-mysql = { group = "org.flywaydb", name = "flyway-mysql" }

# Lombok
lombok = { group = "org.projectlombok", name = "lombok" }

# Test
testcontainers-mysql = { group = "org.testcontainers", name = "mysql" }
archunit = { group = "com.tngtech.archunit", name = "archunit-junit5", version.ref = "archunit" }
wiremock-spring-boot = { group = "org.wiremock.integrations", name = "wiremock-spring-boot", version.ref = "wiremock" }
testcontainers = { group = "org.testcontainers", name = "testcontainers" }
testcontainers-junit = { group = "org.testcontainers", name = "junit-jupiter" }
spring-boot-testcontainers = { group = "org.springframework.boot", name = "spring-boot-testcontainers" }
commons-codec = { group = "commons-codec", name = "commons-codec" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

# Rate Limiting
bucket4j = { group = "com.bucket4j", name = "bucket4j-core", version.ref = "bucket4j" }

# Static Analysis
pmd-java = { group = "net.sourceforge.pmd", name = "pmd-java", version.ref = "pmd" }
findsecbugs = { group = "com.h3xstream.findsecbugs", name = "findsecbugs-plugin", version.ref = "findsecbugs" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
