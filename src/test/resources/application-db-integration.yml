# db-integration 프로파일 — Testcontainers MySQL 연동 통합 테스트 전담
# DataSource URL은 @ServiceConnection이 자동 주입하므로 별도 설정 불필요
spring:
  flyway:
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
  # Redis AutoConfiguration exclude — @MockitoBean(StringRedisTemplate)과 역할이 다름
  # exclude 제거 시 LettuceConnectionConfiguration이 RedisProperties 바인딩을 시도하고,
  # application.yml의 port: ${REDIS_PORT}가 미설정이면 NumberFormatException으로 컨텍스트 로드 실패
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
