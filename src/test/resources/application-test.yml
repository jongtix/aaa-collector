# KIS 프로퍼티 — 테스트용 더미 값
kis:
  base-url: https://localhost
  user-id: testUser
  accounts:
    - alias: test
      account-number: "12345678"
      app-key: test-app-key
      app-secret: test-app-secret

# CatchUpRunner·WsRecovery 테스트 프로파일 비활성화 (CI @SpringBootTest 자동 실행 차단)
aaa:
  ws-recovery:
    enabled: false  # @SpringBootTest ApplicationReadyEvent 발화 시 실 WS 연결 방지 (REQ-WSREC-051)
  catchup:
    enabled: false

# management.endpoint.health.group.readiness는 db/redis 컨트리뷰터 존재를 전제한다(application.yml).
# smoke/db-integration 등 일부 테스트 프로파일은 DataSource/RedisAutoConfiguration을 의도적으로
# exclude하므로, 그 컨텍스트에서는 group membership 검증(기본 true)이 NoSuchHealthContributorException으로
# 실패한다. 프로덕션 검증(application.yml, 기본 true)은 그대로 두고 테스트 전용으로만 완화한다.
management:
  endpoint:
    health:
      validate-group-membership: false

# DbGrantCheckConfig는 기본 활성(matchIfMissing=true, aaa-infra#120)이지만,
# InformationSchemaGrantLoader의 스키마명은 프로덕션 단일 스키마("aaa")로 고정 상수 처리되어 있다
# (의도된 설계, 그 클래스 Javadoc 참고). 이 프로젝트의 Testcontainers MySQLContainer는(계정 미러
# 스크립트를 쓰는 SharedMySqlContainer 포함) 기본적으로 스키마명 "test"를 쓰므로, DbGrantCheckRunner가
# ApplicationRunner로 자동 실행되면 information_schema 조회가 항상 빈 결과를 반환해 기동 시
# DbGrantMissingException을 던진다 — "test" 프로파일이 활성인 모든 기존 통합/smoke 테스트가
# 컨텍스트 로드 실패로 깨진다(실측 확인: db-integration/smoke 조합은 물론
# RedisHealthAutoConfigurationIntegrationTest처럼 "test" 프로파일 단독인 케이스도 포함).
# DbGrantCheckWiringIntegrationTest(SCHEMA_NAME과 일치하는 전용 컨테이너 사용)만
# @TestPropertySource로 이 값을 다시 true로 재활성화한다.
collector:
  db-grant-check:
    enabled: false

# 프로덕션은 환경변수 필수, 테스트는 아래 값으로 오버라이드
spring:
  flyway:
    # SPEC-COLLECTOR-DBGRANT-003 M1-T1: 프로덕션 계정 분리(ADR-026)를 재현하기 위해
    # datasource(@ServiceConnection 기본 계정) fallback을 제거하고, 제한된 flyway 계정
    # (UPDATE 권한 없음)으로 마이그레이션을 실행한다. 값은 com.aaa.collector.support.
    # SharedMySqlContainer의 FLYWAY_USERNAME/FLYWAY_PASSWORD 및
    # src/test/resources/testcontainers/01-init-accounts-mirror.sql과 반드시 일치해야 한다.
    user: flyway
    password: flyway-test-password
  data:
    redis:
      password: ""
