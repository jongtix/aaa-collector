name: Docker

# Release 워크플로 완료 시 트리거
# GITHUB_TOKEN으로 생성한 태그는 다른 워크플로를 트리거하지 않으므로 (GitHub 제약)
# tags: v* 대신 workflow_run 이벤트를 사용한다
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Release 워크플로가 성공한 경우에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      # 1차 checkout: 태그 조회용 (workflow_run의 HEAD는 릴리즈 커밋 이전 시점)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 최신 태그 조회 + semver 검증
      # semantic-release가 릴리즈를 생성하지 않은 경우 (chore 커밋만 등) 빌드 스킵
      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No valid semver release tag found (tag='$TAG'). Skipping build."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      # 2차 checkout: 태그가 가리키는 릴리즈 커밋으로 전환
      # gradle.properties 버전이 업데이트된 소스로 Docker 이미지를 빌드한다
      - name: Checkout release commit
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Login to GHCR
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3-tag 전략: v1.2.3 + latest + sha-xxxxx
      - name: Extract metadata
        if: ${{ steps.tag.outputs.valid == 'true' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Setup Buildx
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # CVE 스캔 게이트 계약: 1) 로컬 적재만 수행(push 아님) 2) Trivy로 스캔
      # 3) 스캔 통과 시에만 아래 Push 스텝에서 GHCR로 올린다.
      # Build/Push 스텝이 각각 별도의 build-push-action 호출이라 이미지가 두 번 빌드되지만
      # (GHA 캐시로 재빌드 비용은 작음), 스캔 대상 이미지와 실제 push 이미지의 동일성을
      # 빌드 단계 자체로 보장하기 위한 의도된 트레이드오프다.
      - name: Build (load for scan)
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CVE 스캔 게이트: CRITICAL/HIGH(fix-available) 발견 시 exit-code 1로 push를 차단한다
      # ignore-unfixed로 수정판 없는 finding은 차단 판정에서 제외한다(REQ-CVE-021)
      # trivyignores를 명시하지 않음 — Trivy CLI가 레포 루트의 .trivyignore를 있으면 자동 소비한다(REQ-CVE-017)
      # continue-on-error/|| true 금지 — DB 다운로드 실패 등도 위장 없이 그대로 실패해야 한다(REQ-CVE-008)
      - name: Scan image for CVEs (Trivy)
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # 스캔 통과 시에만 GHCR로 push
      - name: Push
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
