name: Docker

# 태그 push 트리거 (SPEC-INFRA-CICD-002 M5/F1/REQ-017/018).
# App 토큰(SPEC-INFRA-CICD-002 M3)이 push한 태그는 workflow_run과 달리
# push:tags 이벤트를 실제로 발화한다 — GITHUB_TOKEN push는 발화하지 않는다.
on:
  push:
    tags:
      - 'v*'

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 태그 push 이벤트이므로 checkout 시점의 커밋이 이미 릴리스 커밋이다.
      # workflow_run 시절의 1차(태그 탐색)/2차(재체크아웃) checkout이 불필요해졌다.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # github.ref_name이 곧 push된 태그 이름이므로 git 명령 없이 바로 도출한다.
      - name: Derive version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag format (tag='$TAG'). Skipping build."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      # 게이트 정책 분리: 빌드 소스는 릴리스 태그 트리(재현성), 예외 정책(.trivyignore)은
      # 항상 main HEAD를 본다 — 예외 등록·만료 갱신이 릴리스 없이 즉시 게이트에 반영된다
      # (SPEC-INFRA-CVE-SCAN-001 v0.8.1 REQ-CVE-016/017 운영 구조).
      - name: Overlay .trivyignore from main
        if: ${{ steps.tag.outputs.valid == 'true' }}
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .trivyignore || echo "no .trivyignore on main — scan runs without exceptions"

      - name: Login to GHCR
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3-tag 전략: v1.2.3 + latest + sha-xxxxx
      - name: Extract metadata
        if: ${{ steps.tag.outputs.valid == 'true' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Setup Buildx
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # CVE 스캔 게이트 계약: 1) 로컬 적재만 수행(push 아님) 2) Trivy로 스캔
      # 3) 스캔 통과 시에만 아래 Push 스텝에서 GHCR로 올린다.
      # Build/Push 스텝이 각각 별도의 build-push-action 호출이라 이미지가 두 번 빌드되지만
      # (GHA 캐시로 재빌드 비용은 작음), 스캔 대상 이미지와 실제 push 이미지의 동일성을
      # 빌드 단계 자체로 보장하기 위한 의도된 트레이드오프다.
      - name: Build (load for scan)
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CVE 스캔 게이트: CRITICAL/HIGH(fix-available) 발견 시 exit-code 1로 push를 차단한다
      # ignore-unfixed로 수정판 없는 finding은 차단 판정에서 제외한다(REQ-CVE-021)
      # trivyignores를 명시하지 않음 — Trivy CLI가 레포 루트의 .trivyignore를 있으면 자동 소비한다(REQ-CVE-017)
      # continue-on-error/|| true 금지 — DB 다운로드 실패 등도 위장 없이 그대로 실패해야 한다(REQ-CVE-008)
      - name: Scan image for CVEs (Trivy)
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # 스캔 통과 시에만 GHCR로 push
      - name: Push
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_SYSTEM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_OPERATOR_CHAT_ID }}
          TAG: ${{ steps.tag.outputs.tag || github.ref_name }}
        run: |
          echo "::add-mask::$BOT_TOKEN"
          echo "::add-mask::$CHAT_ID"
          set +x
          NL=$'\n'
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🔒 <b>[CVE 게이트] aaa-collector 빌드 실패</b>${NL}상태: 태그 ${TAG} 빌드 또는 CVE 스캔에서 실패 — GHCR push 차단됨(배포 없음).${NL}확인: ${RUN_URL} 에서 실패 원인 확인 → 필요 시 .trivyignore 예외 등록 후 gh run rerun --failed로 동일 태그 재실행(aaa/.claude/rules/aaa/project-instructions.md § Git Rules 절차 참조)"
          printf 'url = "https://api.telegram.org/bot%s/sendMessage"\n' "$BOT_TOKEN" \
            | curl -sf -K - \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=${TEXT}"
